<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111"><title>DAGA | دخول المدير أو الموظف</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#191919;--line:#383838;--gold:#c7a45b;--text:#f5f2eb;--muted:#aaa}*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(ellipse at top,#29231a 0,transparent 48%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}main{max-width:650px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0}.brand{color:var(--gold);font-weight:900;letter-spacing:2px}h1,h2{margin:8px 0 14px}h2{color:var(--gold);font-size:19px}p,.muted{color:var(--muted);line-height:1.8}label{display:block;margin:12px 0 6px;color:#ddd;font-size:13px}input{width:100%;padding:12px;border-radius:10px;background:#101010;color:var(--text);border:1px solid #484848;font:inherit}button{border:0;border-radius:10px;padding:12px 15px;background:var(--gold);color:#17130b;font:inherit;font-weight:750;cursor:pointer;margin-top:12px;width:100%}button:disabled{opacity:.5}.hidden{display:none!important}.notice{padding:12px;border:1px solid var(--line);border-radius:10px;white-space:pre-wrap;line-height:1.7;margin:12px 0}.error{border-color:#8b4545;color:#ffcaca}.ok{border-color:#427553;color:#d3f6d9}.app-nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.app-nav a{display:inline-block;color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px}.app-nav a:hover{border-color:var(--gold);color:var(--gold)}
</style></head><body><main><div class="brand">DAGA</div><nav class="app-nav" aria-label="التنقل بين وجهات ضجة"><a href="/portal/">الرئيسية</a><a href="/company/">بوابة مالك الشركة</a><a href="/owner-console/">مالك التطبيق</a><a href="/live/?api=staging">LIVE DAGA</a></nav><h1>دخول المدير أو الموظف</h1><p>البوابة دي مخصصة لأعضاء فريق الشركة اللي قبلوا دعوة صالحة. حساب مالك الشركة له بوابة دخول منفصلة.</p><div id="notice" class="notice hidden" role="status" aria-live="polite"></div><section class="card" id="login"><h2>تسجيل دخول الفريق</h2><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" maxlength="254" placeholder="name@example.com" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required><button id="submit">تسجيل الدخول</button><p class="muted">لو لسه ما قبلتش دعوة الشركة، افتح رابط الدعوة اللي وصلك من مالك الشركة أو المدير.</p></section></main>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),say=(t,k)=>{$("notice").textContent=t;$("notice").className="notice "+(k||"");$("notice").classList.remove("hidden")};
async function api(path,body,method="POST",token=""){const headers={"Content-Type":"application/json"};if(token)headers.Authorization="Bearer "+token;const r=await fetch(location.origin+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:"no-store",credentials:"omit",referrerPolicy:"no-referrer"});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.error||"تعذر تسجيل الدخول");return d}
$("submit").addEventListener("click",async()=>{const b=$("submit");b.disabled=true;try{const d=await api("/api/company/team/auth/login",{email:$("email").value.trim(),password:$("password").value});if(!d.account||!["manager","employee"].includes(d.account.role))throw new Error("هذا المسار مخصص للمدير أو الموظف فقط.");const me=await api("/api/company/auth/me",undefined,"GET",d.sessionToken);if(!me.companies||!me.companies.length)throw new Error("الحساب غير مرتبط بشركة معتمدة أو الدعوة لم تُقبل بعد.");const c=me.companies.find(x=>x.role===d.account.role);if(!c)throw new Error("تعذر التحقق من عضوية الفريق. راجع مالك الشركة.");sessionStorage.setItem("daga_account_session_v1",d.sessionToken);sessionStorage.setItem("daga_company_id_v1",c.id);say("تم تسجيل الدخول كـ"+(d.account.role==="manager"?"مدير":"موظف")+" — جاري فتح نظام الشركة.","ok");location.assign("/shop/")}catch(e){const messages={invalid_credentials:"البريد أو كلمة المرور غير صحيحة، أو الحساب ليس حساب مدير/موظف.",company_account_password_setup_required:"الحساب محتاج إكمال إعداد كلمة المرور من رابط الدعوة.",rate_limited:"محاولات كتير. استنى شوية وحاول تاني."};say(messages[e.message]||e.message,"error")}finally{b.disabled=false}});
})();
</script></body></html>
