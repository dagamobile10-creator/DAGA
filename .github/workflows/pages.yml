name: Deploy DAGA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate live app source
        run: |
          test -s index.html
          grep -q 'workers.dev/chat' index.html
          grep -q 'workers.dev/tts' index.html
          grep -q 'daga_mh_memory_v1' index.html
          echo "Root index.html includes chat, TTS, and local conversation memory."

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare DAGA
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          name: daga-pages-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: daga-pages-${{ github.run_attempt }}
