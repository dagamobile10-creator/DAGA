name: Deploy DAGA Voice Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy-worker:
    # Production Worker may only be deployed from the protected main branch, including manual dispatches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare credentials exist
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "Cloudflare secrets are present."

      - name: Diagnose Cloudflare token and account access
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          verify="$(curl -sS --get             -H "Authorization: Bearer $CF_API_TOKEN"             "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          if ! echo "$verify" | jq -e '.success == true and .result.status == "active"' >/dev/null; then
            echo "::error::Cloudflare token verification failed or token is not active. Replace CLOUDFLARE_API_TOKEN with a fresh active Account API token."
            exit 1
          fi
          echo "Cloudflare token is active."

          account="$(curl -sS             -H "Authorization: Bearer $CF_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID")"
          if ! echo "$account" | jq -e '.success == true' >/dev/null; then
            echo "::error::Token is active but cannot access CLOUDFLARE_ACCOUNT_ID. Check that the ID belongs to the same Cloudflare account and the token has Workers Editor access at the account/Worker scope."
            exit 1
          fi
          echo "Cloudflare account ID is accessible with this token."

      - name: Provision persistent D1 memory database
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database"
          listing="$(curl -fsS -G -H "Authorization: Bearer $CF_API_TOKEN" --data-urlencode "name=daga-live-memory" "$endpoint")"
          db_id="$(echo "$listing" | jq -r '.result[]? | select(.name=="daga-live-memory") | .uuid' | head -n1)"
          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            created="$(curl -fsS -X POST "$endpoint" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"daga-live-memory"}')"
            echo "$created" | jq -e '.success == true' >/dev/null
            db_id="$(echo "$created" | jq -r '.result.uuid')"
          fi
          test -n "$db_id" && test "$db_id" != "null"
          echo "DAGA_DB_ID=$db_id" >> "$GITHUB_ENV"
          printf '\n[[d1_databases]]\nbinding = "DAGA_MEMORY_DB"\ndatabase_name = "daga-live-memory"\ndatabase_id = "%s"\n' "$db_id" >> wrangler.toml
          sql='CREATE TABLE IF NOT EXISTS daga_user_memory (user_id TEXT PRIMARY KEY, profile_json TEXT NOT NULL DEFAULT "{}", history_json TEXT NOT NULL DEFAULT "[]", updated_at TEXT NOT NULL);'
          applied="$(curl -fsS -X POST "$endpoint/$db_id/query" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data "$(jq -n --arg sql "$sql" '{sql:$sql}')")"
          echo "$applied" | jq -e '.success == true' >/dev/null
          echo "Persistent D1 memory database and table are ready."

      - name: Inspect LiveAvatar binding metadata without reading values
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          settings="$(curl -fsS --max-time 15 -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/daga-voice/settings")"
          echo "$settings" | jq -r '[.result.bindings[]? | select((.name // "") | test("LIVE.?AVATAR"; "i")) | {name, type}]'
          versions="$(curl -fsS --max-time 15 -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/daga-voice/versions")"
          for version_id in $(echo "$versions" | jq -r '.result[:10][]?.id // empty'); do
            version="$(curl -fsS --max-time 15 -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/daga-voice/versions/$version_id")"
            bindings="$(echo "$version" | jq -c '[.. | objects | select((.name? | strings | test("LIVE.?AVATAR"; "i"))) | {name, type}] | unique' 2>/dev/null)"
            if [ -n "$bindings" ] && [ "$bindings" != "[]" ]; then echo "Version $version_id LiveAvatar binding metadata: $bindings"; fi
          done
      - name: Recover prior LiveAvatar key without printing it
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          versions="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/daga-voice/versions")"
          for version_id in $(echo "$versions" | jq -r '.result[]?.id // empty'); do
            version="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/daga-voice/versions/$version_id")"
            recovered="$(echo "$version" | jq -r '.. | objects | select((.name? | strings | test("LIVE.?AVATAR.*(KEY|TOKEN)"; "i")) and (.type? == "plain_text" or .type? == "text")) | (.text // .value // empty)' | head -n1)"
            if [ -n "$recovered" ] && [ "$recovered" != "null" ]; then
              echo "::add-mask::$recovered"
              echo "LIVEAVATAR_RECOVERED_KEY=$recovered" >> "$GITHUB_ENV"
              echo "A prior plain-text LiveAvatar key was recovered securely."
              exit 0
            fi
          done
          echo "No recoverable plain-text LiveAvatar key exists in Worker version history."
      - name: Deploy daga-voice to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Restore recovered LiveAvatar key as a Worker secret
        if: env.LIVEAVATAR_RECOVERED_KEY != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVEAVATAR_RECOVERED_KEY: ${{ env.LIVEAVATAR_RECOVERED_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$LIVEAVATAR_RECOVERED_KEY" | npx wrangler secret put LIVEAVATAR_API_KEY --name daga-voice
          echo "Recovered LiveAvatar key restored as a Worker secret."

      - name: Configure LiveAvatar secret from repository secret if available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVEAVATAR_API_KEY: ${{ secrets.LIVEAVATAR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LIVEAVATAR_API_KEY:-}" ]; then
            printf '%s' "$LIVEAVATAR_API_KEY" | npx wrangler secret put LIVEAVATAR_API_KEY --name daga-voice
            echo "LiveAvatar key installed as a Worker secret."
          else
            echo "No LIVEAVATAR_API_KEY repository secret is configured."
          fi

      - name: Verify LiveAvatar configuration without exposing private avatar data
        if: always()
        run: |
          set +e
          echo "Worker health configuration:"
          curl -fsS --max-time 15 "https://daga-voice.dagamobile10.workers.dev/health" | jq '{ok, voiceConfigured, chatConfigured, freeChatConfigured, liveAvatarConfigured, liveAvatarIdConfigured}'
          echo "LiveAvatar account status:"
          result="$(curl -sS --max-time 20 -w '\nHTTP_STATUS:%{http_code}' "https://daga-voice.dagamobile10.workers.dev/liveavatar/avatars")"
          body="${result%HTTP_STATUS:*}"
          status="${result##*HTTP_STATUS:}"
          echo "HTTP status: $status"
          echo "$body" | jq 'if .ok then {ok, count, activeCount, hasActiveDaga} else {error, status} end' 2>/dev/null || echo "LiveAvatar endpoint returned a non-JSON response."
