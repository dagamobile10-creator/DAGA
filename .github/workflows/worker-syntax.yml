name: LIVE DAGA Worker Syntax

on:
  pull_request:
    paths:
      - 'worker.js'
      - '.github/workflows/worker-syntax.yml'
  push:
    branches:
      - main
      - feature/live-daga-memory-context
    paths:
      - 'worker.js'
      - '.github/workflows/worker-syntax.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: cp worker.js /tmp/worker.mjs && node --check /tmp/worker.mjs
