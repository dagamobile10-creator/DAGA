name: DAGA V30 navigation checks

on:
  push:
    branches:
      - fix-daga-v30-navigation-flow
    paths:
      - "index.html"
      - "go/index.html"
      - "owner-console.html"
      - "company/portal.html"
      - "invite/index.html"
      - "worker.js"
      - "tests/test_navigation_routes.py"
      - ".github/workflows/navigation-checks.yml"
  pull_request:
    branches:
      - daga-v30-implementation
    paths:
      - "index.html"
      - "go/index.html"
      - "owner-console.html"
      - "company/portal.html"
      - "invite/index.html"
      - "worker.js"
      - "tests/test_navigation_routes.py"
      - ".github/workflows/navigation-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check LIVE DAGA inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, re.S)
          assert scripts, "No inline LIVE DAGA scripts found"
          for index, (attrs, source) in enumerate(scripts):
              kind = "module" if 'type="module"' in attrs else "classic"
              path = f"/tmp/daga-live-{kind}-{index}.js"
              with open(path, "w", encoding="utf-8") as out:
                  out.write(source)
              print(path)
          PY
          for file in /tmp/daga-live-classic-*.js; do node --check "$file"; done
          for file in /tmp/daga-live-module-*.js; do node --input-type=module --check < "$file"; done
      - name: Check route links and LIVE DAGA compatibility
        run: python tests/test_navigation_routes.py -v
