name: DAGA isolated staging setup

on:
  workflow_dispatch:
  push:
    branches: [daga-v30-implementation, daga-email-only-auth, feat/v30-original-ui-unified-review]
    paths:
      - ".github/workflows/daga-staging-setup.yml"
      - "worker.js"
      - "index.html"
      - "owner-console.html"
      - "owner-auth.js"
      - "owner-admin.js"
      - "shop-auth.js"
      - "company-invitations.js"
      - "company-orders.js"
      - "wrangler.toml"
      - "migrations/**"
      - "invite/**"
      - "company/**"
      - "shop-dashboard-v30.html"
      - "go/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate-workflow:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[stage]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging workflow file
        run: |
          test -s .github/workflows/daga-staging-setup.yml
          grep -q 'workflow_dispatch:' .github/workflows/daga-staging-setup.yml
          grep -q 'daga-app-staging' .github/workflows/daga-staging-setup.yml
          echo "Staging workflow is present. This push also runs the isolated staging deployment job."

  provision-staging:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate staging secrets and Cloudflare access
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in CF_API_TOKEN CF_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing required GitHub secret: $name"; exit 1; fi
          done
          verify="$(curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          echo "$verify" | jq -e '.success == true and .result.status == "active"' >/dev/null
          account="$(curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID")"
          echo "$account" | jq -e '.success == true' >/dev/null
      - name: Create or reuse isolated staging D1
        id: db
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database"
          listing="$(curl -fsS -G -H "Authorization: Bearer $CF_API_TOKEN" --data-urlencode "name=daga-app-staging" "$endpoint")"
          db_id="$(echo "$listing" | jq -r '.result[]? | select(.name=="daga-app-staging") | .uuid' | head -n1)"
          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            created="$(curl -fsS -X POST "$endpoint" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"daga-app-staging"}')"
            echo "$created" | jq -e '.success == true' >/dev/null
            db_id="$(echo "$created" | jq -r '.result.uuid')"
          fi
          test -n "$db_id" && test "$db_id" != "null"
          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"
      - name: Prepare isolated staging Worker config
        env:
          D1_ID: ${{ steps.db.outputs.database_id }}
        run: |
          set -euo pipefail
          cat > wrangler.staging.toml <<EOF
          name = "daga-app-staging"
          main = "worker.js"
          compatibility_date = "2026-10-06"
          [ai]
          binding = "AI"
          [vars]
          DAGA_APP_BASE_URL = "https://daga-app-staging.dagamobile10.workers.dev"
          DAGA_ALLOWED_ORIGINS = "https://dagamobile10-creator.github.io"
          DAGA_MEMORY_REQUIRE_AUTH = "true"
          # The V30 browser client sends the approved shop session token on chat/TTS/LiveAvatar requests.
          DAGA_VOICE_REQUIRE_AUTH = "true"
          # Enforce the LIVE DAGA character ledger only in isolated staging.
          DAGA_LIVE_QUOTA_ENFORCE = "true"
          DAGA_PUBLIC_API_RATE_LIMITS = "true"
          [[d1_databases]]
          binding = "DAGA_APP_DB"
          database_name = "daga-app-staging"
          database_id = "$D1_ID"
          migrations_dir = "staging-migrations"
          EOF
      - name: Apply migrations to staging D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p staging-migrations
          for file in migrations/0001_daga_core.sql migrations/0002_daga_owner_auth.sql migrations/0003_daga_owner_credentials.sql migrations/0004_daga_offers.sql migrations/0005_daga_store_identity_invitations.sql migrations/0006_daga_public_identity_ids.sql migrations/0007_daga_company_registration_challenges.sql migrations/0008_daga_company_login_challenges.sql migrations/0009_daga_payment_submission_uniqueness.sql migrations/0010_email_only_auth.sql migrations/0011_email_only_registration_challenges.sql migrations/0012_company_email_onboarding.sql migrations/0013_shop_email_registration.sql migrations/0014_shop_onboarding_contact_and_status.sql migrations/0015_preserve_existing_shop_approval_states.sql; do
            clean="staging-migrations/$(basename "$file")"
            grep -v '^[[:space:]]*PRAGMA foreign_keys' "$file" > "$clean"
          done
          npx --yes wrangler@3 d1 migrations apply daga-app-staging --remote --config wrangler.staging.toml
      - name: Deploy isolated staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.staging.toml
      - name: Configure staging-only auth and delivery secrets
        id: configure-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAGA_OTP_PEPPER: ${{ secrets.DAGA_OTP_PEPPER }}
          DAGA_OWNER_BOOTSTRAP_TOKEN: ${{ secrets.DAGA_STAGING_OWNER_BOOTSTRAP_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DAGA_EMAIL_FROM: ${{ secrets.DAGA_EMAIL_FROM }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LIVEAVATAR_API_KEY: ${{ secrets.LIVEAVATAR_API_KEY }}
          LIVEAVATAR_AVATAR_ID: ${{ secrets.LIVEAVATAR_AVATAR_ID }}
        run: |
          set -euo pipefail
          # Configure optional voice providers independently of OTP readiness.
          # A missing live SMS provider must not prevent staging voice secrets from being applied.
          voice_missing=()
          for name in ELEVENLABS_API_KEY OPENAI_API_KEY GROQ_API_KEY LIVEAVATAR_API_KEY LIVEAVATAR_AVATAR_ID; do
            if [ -n "${!name:-}" ]; then
              printf '%s' "${!name}" | npx --yes wrangler@3 secret put "$name" --name daga-app-staging
            else
              voice_missing+=("$name")
            fi
          done
          missing=()
          for name in DAGA_OTP_PEPPER DAGA_OWNER_BOOTSTRAP_TOKEN RESEND_API_KEY DAGA_EMAIL_FROM; do
            if [ -z "${!name:-}" ]; then
              if [ "$name" = "DAGA_OWNER_BOOTSTRAP_TOKEN" ]; then missing+=("DAGA_STAGING_OWNER_BOOTSTRAP_TOKEN"); else missing+=("$name"); fi
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            missing_csv="$(IFS=', '; echo "${missing[*]}")"
            echo "::warning::Missing required staging auth/delivery secrets: $missing_csv"
            {
              echo "## DAGA staging readiness"
              echo "- Infrastructure: deployed; schema migrations and runtime smoke checks are verified separately below."
              echo "- Owner authentication / OTP delivery: **BLOCKED**."
            echo "- Voice/chat/TTS are explicitly in legacy compatibility mode; this does not establish tenant-secure voice identity."
              echo "- Missing GitHub Actions repository secrets: $missing_csv."
              echo "- Add the missing secrets under Settings → Secrets and variables → Actions, then rerun this workflow. Staging bootstrap uses the separate DAGA_STAGING_OWNER_BOOTSTRAP_TOKEN secret; it does not reuse the production bootstrap token."
              echo "- Optional voice secrets missing: ${voice_missing[*]:-none}."
              echo "- Production Worker and main branch were not targeted."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "auth_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in DAGA_OTP_PEPPER DAGA_OWNER_BOOTSTRAP_TOKEN RESEND_API_KEY DAGA_EMAIL_FROM; do
            if [ -n "${!name:-}" ]; then
              printf '%s' "${!name}" | npx --yes wrangler@3 secret put "$name" --name daga-app-staging
            fi
          done
          echo "auth_ready=true" >> "$GITHUB_OUTPUT"
          {
            echo "## DAGA staging readiness"
            echo "- Email-only owner authentication and email OTP delivery secrets: present and configured on the isolated staging Worker. The staging bootstrap token is sourced from the dedicated DAGA_STAGING_OWNER_BOOTSTRAP_TOKEN GitHub secret, separate from production."
            echo "- Owner bootstrap and real email delivery still require end-to-end verification with the designated owner."
            echo "- Voice/chat/TTS remain explicitly in legacy compatibility mode until the client sends verified sessions; do not treat these smoke tests as authenticated voice validation."
            echo "- Production Worker and main branch were not targeted."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify staging health without printing secrets
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS --max-time 15 https://daga-app-staging.dagamobile10.workers.dev/health -o /tmp/health.json; then break; fi
            sleep 5
          done
          jq -e '.ok == true' /tmp/health.json >/dev/null || { echo "::error::Staging health endpoint did not report ok=true"; cat /tmp/health.json; exit 1; }
          jq '{ok,voiceConfigured,chatConfigured,freeChatConfigured,liveAvatarConfigured}' /tmp/health.json
          # Anonymous chat must be denied while account authentication is enforced.
          chat_code="$(curl -sS -o /tmp/chat-smoke.json -w '%{http_code}' --max-time 20 \
            -H 'Content-Type: application/json' -d '{"text":"اختبار"}' \
            https://daga-app-staging.dagamobile10.workers.dev/chat)"
          test "$chat_code" = "401" || { echo "::error::Anonymous staging chat returned HTTP $chat_code"; cat /tmp/chat-smoke.json; exit 1; }
          grep -q 'authenticated_account_required' /tmp/chat-smoke.json || { echo "::error::Anonymous staging chat did not return the expected authentication error"; cat /tmp/chat-smoke.json; exit 1; }
          echo "Staging anonymous chat denial test passed."
          # Anonymous TTS must be denied now that staging voice identity and LIVE DAGA quota are enforced.
          if jq -e '.voiceConfigured == true' /tmp/health.json >/dev/null; then
            tts_code="$(curl -sS -o /tmp/tts-anon.json -w '%{http_code}' --max-time 20 \
              -H 'Content-Type: application/json' -d '{"text":"اختبار الصوت."}' \
              https://daga-app-staging.dagamobile10.workers.dev/tts)"
            test "$tts_code" = "401" || { echo "::error::Anonymous staging TTS should return HTTP 401, got $tts_code"; cat /tmp/tts-anon.json; exit 1; }
            grep -q 'authenticated_account_required' /tmp/tts-anon.json || { echo "::error::Anonymous staging TTS did not fail with the expected authentication error"; cat /tmp/tts-anon.json; exit 1; }
            echo "Staging TTS anonymous-denial test passed."
          else
            echo "::warning::Staging TTS auth smoke test skipped: ELEVENLABS_API_KEY is not configured."
          fi
          # Runtime CORS smoke test: only the configured staging origin may be authorized.
          curl -fsS -D /tmp/cors-allowed.headers -o /dev/null -X OPTIONS \
            -H 'Origin: https://dagamobile10-creator.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            https://daga-app-staging.dagamobile10.workers.dev/api/company/auth/register
          grep -qi '^access-control-allow-origin: https://dagamobile10-creator.github.io' /tmp/cors-allowed.headers
          curl -sS -D /tmp/cors-hostile.headers -o /dev/null -X OPTIONS \
            -H 'Origin: https://untrusted.example' \
            -H 'Access-Control-Request-Method: POST' \
            https://daga-app-staging.dagamobile10.workers.dev/api/company/auth/register
          if grep -Eqi '^access-control-allow-origin: (\\*|https://untrusted\\.example)([[:space:]]|$)' /tmp/cors-hostile.headers; then
            echo "::error::Staging API returned an allow-origin header for an untrusted origin"; exit 1
          fi
          # Owner bootstrap API must follow the same fail-closed CORS policy.
          curl -sS -D /tmp/owner-cors-hostile.headers -o /dev/null -X OPTIONS \
            -H 'Origin: https://untrusted.example' \
            -H 'Access-Control-Request-Method: POST' \
            https://daga-app-staging.dagamobile10.workers.dev/owner/bootstrap/start
          if grep -Eqi '^access-control-allow-origin: (\\*|https://untrusted\\.example)([[:space:]]|$)' /tmp/owner-cors-hostile.headers; then
            echo "::error::Owner API returned an allow-origin header for an untrusted origin"; exit 1
          fi
          echo "Staging company and owner API CORS checks passed: no wildcard origin was returned."
          for path in /go/ /shop-access/ /company/ /invite/ /owner/ /owner-console/ /shop/; do
            code="$(curl -sS -o "/tmp/page-$(echo "$path" | tr '/' '_').html" -w '%{http_code}' --max-time 15 "https://daga-app-staging.dagamobile10.workers.dev$path")"
            if [ "$code" != "200" ]; then echo "::error::Staging page $path returned HTTP $code"; exit 1; fi
            echo "Staging page $path returned HTTP 200."
          done
          grep -q 'إدارة مالك التطبيق' /tmp/page-_owner_.html || { echo "::error::Owner console route did not serve the owner console HTML"; exit 1; }
          grep -q 'const API=window.location.origin;' /tmp/page-_owner_.html || { echo "::error::Owner console is not configured to use its same-origin Worker API"; exit 1; }
          grep -q 'الاشتراكات والمدفوعات' /tmp/page-_company_.html || { echo "::error::Company portal checkout UI is missing from the served HTML"; exit 1; }
          grep -q '/api/company/offers?service=' /tmp/page-_company_.html || { echo "::error::Company portal offer selection is missing from the served HTML"; exit 1; }
          if grep -q 'const API=.https://daga-voice.dagamobile10.workers.dev' /tmp/page-_owner_.html; then
            echo "::error::Owner console must not hard-code the production voice Worker"; exit 1
          fi
          code="$(curl -sS -o /tmp/me.json -w '%{http_code}' --max-time 15 https://daga-app-staging.dagamobile10.workers.dev/api/company/auth/me)"
          test "$code" = "401" || { echo "::error::Unauthenticated company account endpoint returned HTTP $code"; exit 1; }
          # Staging memory must reject anonymous callers even before its storage binding is configured.
          code="$(curl -sS -o /tmp/memory-anon.json -w '%{http_code}' --max-time 15 'https://daga-app-staging.dagamobile10.workers.dev/memory?userId=00000000-0000-4000-8000-000000000000')"
          test "$code" = "401" || { echo "::error::Unauthenticated memory endpoint returned HTTP $code"; exit 1; }
          grep -q 'authenticated_account_required' /tmp/memory-anon.json || { echo "::error::Memory endpoint did not reject anonymous identity"; exit 1; }
          code="$(curl -sS -o /tmp/invites.json -w '%{http_code}' --max-time 15 'https://daga-app-staging.dagamobile10.workers.dev/api/company/invitations?storeId=00000000-0000-4000-8000-000000000000')"
          test "$code" = "401" || { echo "::error::Unauthenticated invitation endpoint returned HTTP $code"; exit 1; }
          # Owner session and administration endpoints must reject unauthenticated callers too.
          code="$(curl -sS -o /tmp/owner-me.json -w '%{http_code}' --max-time 15 https://daga-app-staging.dagamobile10.workers.dev/owner/auth/me)"
          test "$code" = "401" || { echo "::error::Unauthenticated owner session endpoint returned HTTP $code"; exit 1; }
          code="$(curl -sS -o /tmp/owner-admin.json -w '%{http_code}' --max-time 15 https://daga-app-staging.dagamobile10.workers.dev/owner/admin/overview)"
          test "$code" = "401" || { echo "::error::Unauthenticated owner administration endpoint returned HTTP $code"; exit 1; }
          for path in /api/company/plans /api/company/payment-methods /api/company/offers?service=store /api/company/orders; do
            code="$(curl -sS -o /tmp/company-orders.json -w '%{http_code}' --max-time 15 "https://daga-app-staging.dagamobile10.workers.dev$path")"
            test "$code" = "401" || { echo "::error::Unauthenticated company order endpoint $path returned HTTP $code"; exit 1; }
          done
          code="$(curl -sS -o /tmp/order-payment.json -w '%{http_code}' --max-time 15 -H 'Content-Type: application/json' -d '{}' https://daga-app-staging.dagamobile10.workers.dev/api/company/orders/00000000-0000-4000-8000-000000000000/payment)"
          test "$code" = "401" || { echo "::error::Unauthenticated order payment submission returned HTTP $code"; exit 1; }
          code="$(curl -sS -o /tmp/register.json -w '%{http_code}' --max-time 15 -H 'Content-Type: application/json' -d '{}' https://daga-app-staging.dagamobile10.workers.dev/api/company/auth/register)"
          test "$code" = "400" || { echo "::error::Registration must reject an empty invalid request; got HTTP $code"; exit 1; }
          echo "Unauthenticated company, invitation, owner-session, owner-admin, plan, payment-method, offer, order, and order-payment APIs reject access; registration rejects malformed requests."
          echo "Staging Worker only. Production Worker and main branch were not targeted."
      - name: Require owner-auth secrets for a green staging run
        if: always()
        env:
          AUTH_READY: ${{ steps.configure-secrets.outputs.auth_ready }}
          SMOKE_OUTCOME: ${{ steps.configure-secrets.outcome }}
        run: |
          set -euo pipefail
          if [ "$SMOKE_OUTCOME" != "success" ]; then
            echo "::error::Staging auth-secret configuration step did not complete successfully."
            exit 1
          fi
          if [ "$AUTH_READY" != "true" ]; then
            echo "::error::Staging infrastructure may be deployed, but owner authentication/email delivery secrets are missing. This run must not be reported as staging-ready."
            exit 1
          fi
          echo "Staging owner-auth secret readiness gate passed."
